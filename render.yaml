services:
  - type: worker
    name: homazing-quoting-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ZOHO_CLIENT_ID
        sync: false
      - key: ZOHO_CLIENT_SECRET
        sync: false
      - key: ZOHO_REFRESH_TOKEN
        sync: false
      - key: ZOHO_ACCOUNT_ID
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: APPROVAL_BASE_URL
        sync: false
      - key: GOOGLE_SHEET_ID
        value: 1rSiOd_kTw2A8ynDnAcc9QvoUFQal3OidtcQ_RZRwu40
      - key: GOOGLE_SHEET_TAB
        value: Staging Jobs
      - key: GOOGLE_TOKEN_JSON
        sync: false
